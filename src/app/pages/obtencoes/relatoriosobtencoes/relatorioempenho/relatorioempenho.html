<app-breadcrumb [items]="[
    { label: 'Página inicial', url: '/' },
    { label: 'Obtenções', url: '/obtencoes/' },
    { label: 'Central de Relatórios', url: '/obtencoes/relatoriosobtencoes' },
    { label: 'Relatório de Comprometimento Orçamentário', url: '/obtencoes/relatoriosobtencoes/relatoriofluxoorcamento' }
  ]">
</app-breadcrumb>

<h3>Relatório de Comprometimento Orçamentário</h3>

<p>Gere o relatório de comprometimento orçamentário por superintendências e forma de obtenção.</p>

<!-- Filtros -->
<div class="row mt-3">
    <div class="col-12">
        <div class="br-card">
            <div class="card-header">
                <div class="ml-3">
                    <div class="text-weight-semi-bold text-up-02">Filtros</div>
                </div>
            </div>
            <div class="card-content">

                <div class="row mt-3 mb-3">
                   <div class="col-2">
                        <br-select label="Tipo de relatório *" is-multiple="false" required="true" placeholder="Selecione uma opção"
                            (valueChange)="alterarTipoRelatorio($event)" options='[
                            { "label": "LOA", "value": "1", "selected": true },
                            { "label": "Adjudicação", "value": "2", "selected": false },
                            { "label": "Compensação", "value": "3", "selected": false }
                        ]'>
                        </br-select>
                    </div>                    
                    <div class="col-3">
                        <br-select [hidden]="tipoRelatorio !== '1'" label="Forma de Obtenção" is-multiple="true"
                            placeholder="Selecione uma opção" options='[
                        { "label": "Desapropriação Lei 8.629/93", "value": "1", "selected": false },
                        { "label": "Desapropriação Lei 4.132/62", "value": "2", "selected": false },
                        { "label": "Compra e Venda Decreto 433/92", "value": "3", "selected": false },
                        { "label": "Leilão", "value": "4", "selected": false }
                        ]'></br-select>

                        <br-select [hidden]="tipoRelatorio == '1'" label="Ano *" is-multiple="false"
                            placeholder="Selecione uma opção" options='[
                        { "label": "2026", "value": "1", "selected": false },
                        { "label": "2025", "value": "2", "selected": false },
                        { "label": "2024", "value": "3", "selected": false },
                        { "label": "2023", "value": "4", "selected": false }
                        ]'></br-select>
                    </div>

                    <div class="col-2">
                        <br-select label="Superintendências" is-multiple="true" placeholder="Selecione uma opção" keep-open-on-select="true"
                            options='[
                            { "label": "SR(01) PA", "value": "01", "selected": false },
                            { "label": "SR(02) CE", "value": "02", "selected": false },
                            { "label": "SR(03) PE", "value": "03", "selected": false },
                            { "label": "SR(04) GO", "value": "04", "selected": false },
                            { "label": "SR(05) BA", "value": "05", "selected": false },
                            { "label": "SR(06) MG", "value": "06", "selected": false },
                            { "label": "SR(08) SP", "value": "08", "selected": false },
                            { "label": "SR(09) PR", "value": "09", "selected": false },
                            { "label": "SR(10) SC", "value": "10", "selected": false },
                            { "label": "SR(11) RS", "value": "11", "selected": false },
                            { "label": "SR(12) MA", "value": "12", "selected": false },
                            { "label": "SR(13) MT", "value": "13", "selected": false },
                            { "label": "SR(14) AC", "value": "14", "selected": false },
                            { "label": "SR(15) AM", "value": "15", "selected": false },
                            { "label": "SR(16) MS", "value": "16", "selected": false },
                            { "label": "SR(18) PB", "value": "18", "selected": false },
                            { "label": "SR(19) RN", "value": "19", "selected": false },
                            { "label": "SR(20) ES", "value": "20", "selected": false },
                            { "label": "SR(22) AL", "value": "22", "selected": false },
                            { "label": "SR(23) SE", "value": "23", "selected": false },
                            { "label": "SR(24) PI", "value": "24", "selected": false },
                            { "label": "SR(26) TO", "value": "26", "selected": false },
                            { "label": "SR(27) MBA", "value": "27", "selected": false },
                            { "label": "SR(28) DFE", "value": "28", "selected": false },
                            { "label": "SR(29) MSF", "value": "29", "selected": false }
                        ]'>
                        </br-select>
                    </div>

                    <div class="col-2">
                        <br-select label="UF" is-multiple="true" keep-open-on-select="true" placeholder="Selecione uma opção" options='[
                        { "label": "AC", "value": "1", "selected": false },
                        { "label": "AL", "value": "2", "selected": false },
                        { "label": "AP", "value": "3", "selected": false },
                        { "label": "AM", "value": "4", "selected": false },
                        { "label": "BA", "value": "5", "selected": false },
                        { "label": "CE", "value": "6", "selected": false },
                        { "label": "DF", "value": "7", "selected": false },
                        { "label": "ES", "value": "8", "selected": false },
                        { "label": "GO", "value": "9", "selected": false },
                        { "label": "MA", "value": "10", "selected": false },
                        { "label": "MT", "value": "11", "selected": false },
                        { "label": "MS", "value": "12", "selected": false },
                        { "label": "MG", "value": "13", "selected": false },
                        { "label": "PA", "value": "14", "selected": false },
                        { "label": "PB", "value": "15", "selected": false },
                        { "label": "PR", "value": "16", "selected": false },
                        { "label": "PE", "value": "17", "selected": false },
                        { "label": "PI", "value": "18", "selected": false },
                        { "label": "RJ", "value": "19", "selected": false },
                        { "label": "RN", "value": "20", "selected": false },
                        { "label": "RS", "value": "21", "selected": false },
                        { "label": "RO", "value": "22", "selected": false },
                        { "label": "RR", "value": "23", "selected": false },
                        { "label": "SC", "value": "24", "selected": false },
                        { "label": "SP", "value": "25", "selected": false },
                        { "label": "SE", "value": "26", "selected": false },
                        { "label": "TO", "value": "27", "selected": false }
                        ]'></br-select>
                    </div>

                    <div class="col-3 mt-4 d-flex justify-content-end">

                        <br-button emphasis="secondary">
                            <i class="fas fa-eraser mr-3" aria-hidden="true"></i>
                            Limpar
                        </br-button>


                        <br-button emphasis="primary" class="ml-3" (click)="gerarRelatorio()">
                            <i class="fas fa-clipboard-list mr-3" aria-hidden="true"></i>
                            Gerar PDF
                        </br-button>

                    </div>
                </div>
                <div class="row mt-3 mb-3">
                    <div class="col-12">
                        <br-input label="Subtítulo do PDF (Opcional)" placeholder="Ex: Relatório Anual 2026" (valueChange)="onSubtituloChange($event)"
                            density="medium"></br-input>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Rodapé -->
<div class="br-modal-footer d-flex justify-content-start">
    <br-button emphasis="secondary" [routerLink]="['/obtencoes/relatoriosobtencoes']">
        <i class="fas fa-arrow-left mr-2"></i>
        Voltar
    </br-button>
</div>
