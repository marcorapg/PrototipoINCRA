<app-breadcrumb [items]="[
    { label: 'Página inicial', url: '/' },
    { label: 'Obtenções', url: '/obtencoes/' },
    { label: 'Central de Relatórios', url: '/obtencoes/relatoriosobtencoes' },
    { label: 'Relatório de Fluxo de Orçamento', url: '/obtencoes/relatoriosobtencoes/relatoriofluxoorcamento' }
  ]">
</app-breadcrumb>

<h3>Relatório de Fluxo de Orçamento</h3>

<p>Gere o relatório de Fluxo de Orçamento por ano, superintendências e forma de obtenção.</p>

<!-- Filtros -->
<div class="row mt-3">
    <div class="col-12">
        <div class="br-card">
            <div class="card-header">
                <div class="ml-3">
                    <div class="text-weight-semi-bold text-up-02">Filtros</div>
                </div>
            </div>
            <div class="card-content">
                <div class="row mt-3 mb-3">
                    <div class="col-2">
                        <br-select label="Ano *" placeholder="Selecione uma opção" options='[
                        { "label": "2026", "value": "1", "selected": true },
                        { "label": "2025", "value": "2", "selected": false },
                        { "label": "2024", "value": "3", "selected": false },
                        { "label": "2023", "value": "4", "selected": false },
                        { "label": "2022", "value": "5", "selected": false },
                        { "label": "2021", "value": "6", "selected": false }
                        ]'></br-select>
                    </div>

                    <div class="col-2">
                        <br-select label="Superintendências" is-multiple="true" placeholder="Selecione uma opção"
                            options='[
                            { "label": "SR(01) PA", "value": "01", "selected": false },
                            { "label": "SR(02) CE", "value": "02", "selected": false },
                            { "label": "SR(03) PE", "value": "03", "selected": false },
                            { "label": "SR(04) GO", "value": "04", "selected": false },
                            { "label": "SR(05) BA", "value": "05", "selected": false },
                            { "label": "SR(06) MG", "value": "06", "selected": false },
                            { "label": "SR(08) SP", "value": "08", "selected": false },
                            { "label": "SR(09) PR", "value": "09", "selected": false },
                            { "label": "SR(10) SC", "value": "10", "selected": false },
                            { "label": "SR(11) RS", "value": "11", "selected": false },
                            { "label": "SR(12) MA", "value": "12", "selected": false },
                            { "label": "SR(13) MT", "value": "13", "selected": false },
                            { "label": "SR(14) AC", "value": "14", "selected": false },
                            { "label": "SR(15) AM", "value": "15", "selected": false },
                            { "label": "SR(16) MS", "value": "16", "selected": false },
                            { "label": "SR(18) PB", "value": "18", "selected": false },
                            { "label": "SR(19) RN", "value": "19", "selected": false },
                            { "label": "SR(20) ES", "value": "20", "selected": false },
                            { "label": "SR(22) AL", "value": "22", "selected": false },
                            { "label": "SR(23) SE", "value": "23", "selected": false },
                            { "label": "SR(24) PI", "value": "24", "selected": false },
                            { "label": "SR(26) TO", "value": "26", "selected": false },
                            { "label": "SR(27) MBA", "value": "27", "selected": false },
                            { "label": "SR(28) DFE", "value": "28", "selected": false },
                            { "label": "SR(29) MSF", "value": "29", "selected": false }
                        ]'>
                        </br-select>
                    </div>

                    <div class="col-2">
                        <br-select label="Forma de Obtenção" is-multiple="true" placeholder="Selecione uma opção"
                            options='[
                        { "label": "Desapropriação Lei 8.629/93", "value": "1", "selected": false },
                        { "label": "Desapropriação Lei 4.132/62", "value": "2", "selected": false },
                        { "label": "Compra e Venda Decreto 433/92", "value": "3", "selected": false },
                        { "label": "Doação", "value": "4", "selected": false },
                        { "label": "Adjudicação", "value": "5", "selected": false },
                        { "label": "Aquisição Onerosa (Compensação)", "value": "6", "selected": false },
                        { "label": "Arrecadação de Terras Públicas  ", "value": "7", "selected": false }                      
                        ]'></br-select>
                    </div>

                    <div class="col-2 mt-5">
                        <br-checkbox name="default01" label="Incluir valores previstos" [checked]="incluirPrevistos"
                            (checkedChange)="incluirPrevistos = $event.detail"></br-checkbox>
                    </div>

                    <div class="col-4 mt-4 d-flex justify-content-end">

                        <br-button emphasis="secondary">
                            <i class="fas fa-eraser mr-3" aria-hidden="true"></i>
                            Limpar
                        </br-button>


                        <br-button emphasis="primary" class="ml-3" (click)="gerarRelatorio()">
                            <i class="fas fa-clipboard-list mr-3" aria-hidden="true"></i>
                            Gerar PDF
                        </br-button>

                    </div>
                </div>
                <div class="row mt-3 mb-3">
                    <div class="col-12">
                        <br-input label="Subtítulo do PDF (Opcional)" placeholder="Ex: Relatório Anual 2026" (valueChange)="onSubtituloChange($event)"
                            density="medium"></br-input>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Rodapé -->
<div class="br-modal-footer d-flex justify-content-start">
    <br-button emphasis="secondary" [routerLink]="['/obtencoes/relatoriosobtencoes']">
        <i class="fas fa-arrow-left mr-2"></i>
        Voltar
    </br-button>
</div>
